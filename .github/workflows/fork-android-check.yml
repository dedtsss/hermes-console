name: RU Android source build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ru-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: github.repository == 'dedtsss/hermes-console'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify RU translation and overlay gates
        run: |
          python3 tool/fork/localization.py check
          python3 tool/fork/sync.py check-overlay
          python3 tool/fork/check_identity.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.1'
          channel: stable
      - run: flutter pub get --enforce-lockfile
      # Build evidence only; no signing secrets, uploads or distributable APKs.
      - name: Compile Android full flavor without release signing
        run: flutter build apk --debug --flavor full --dart-define=HERMES_FLAVOR=full
